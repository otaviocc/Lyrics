[package]
name = "lyrics-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fetch synced/plain lyrics from LRCLIB or lrcmux and write them as sidecar files next to your music."
repository = "https://github.com/otaviocc/Lyrics"
license = "MIT"

[lib]
name = "lyrics"
path = "src/lib.rs"

[[bin]]
name = "lyrics"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
lofty = "0.25"
ureq = { version = "3.4", features = ["json"] }
http = "1.5"
httpdate = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 2
