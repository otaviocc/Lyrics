# Solarized Dark — Ethan Schoonover's palette, upstream names in the comments.
name = "solarized-dark"

[palette]
background           = "#002b36"   # base03
foreground           = "#839496"   # base0
muted                = "#586e75"   # base01
muted_text           = "#657b83"   # base00
subtle               = "#073642"   # base02
cursor               = "#103f4c"   # between base02 and base01, a step lighter
selection_background = "#586e75"   # base01
selection_foreground = "#fdf6e3"   # base3
error                = "#dc322f"   # red
success              = "#859900"   # green
warning              = "#b58900"   # yellow
accent               = "#268bd2"   # blue
chrome               = "#2aa198"   # cyan
highlight            = "#6c71c4"   # violet
notice               = "#d33682"   # magenta
